services:
  guardian:
    build: .
    image: cloud-cost-guardian:latest
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_PATH: /data/guardian.db
      ALERT_INTERVAL_MS: 900000
    volumes:
      - ccg-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ccg-data:
